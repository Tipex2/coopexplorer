slam_toolbox:
  ros__parameters:
    mode: mapping
    scan_topic: /tb3_0/scan
    odom_frame: tb3_0/odom
    base_frame: tb3_0/base_footprint
    map_frame: map
    use_sim_time: true
    max_laser_range: 8.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.174
    map_update_interval: 3.0
    resolution: 0.05
    do_loop_closing: false
